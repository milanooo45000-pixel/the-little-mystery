
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Little Mystery</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17120f;color:#f7e9d2;font-family:Georgia,serif}
#game{width:100%;min-height:100vh;display:grid;place-items:center;padding:18px}
.frame{width:min(100%,1100px);aspect-ratio:16/9;position:relative;overflow:hidden;border:5px solid #49301e;border-radius:12px;background:linear-gradient(#34251f 0 65%,#563a27 65%);box-shadow:0 20px 70px #000}
.wall{position:absolute;inset:0 0 35%;background:repeating-linear-gradient(90deg,transparent 0 95px,#ffffff08 96px 98px),linear-gradient(#8c6244,#68452f)}
.floor{position:absolute;bottom:0;height:35%;width:100%;background:repeating-linear-gradient(0deg,#68452f 0 20px,#4a3023 21px 23px)}
.window{position:absolute;top:12%;left:43%;width:23%;height:43%;border:9px solid #4c3020;background:linear-gradient(#101d35,#263e48);box-shadow:inset 0 0 0 4px #c3a27b}
.window:after{content:"☾ ·  ✦  · ✦";color:#f5e7b8;display:grid;place-items:center;height:100%;font-size:clamp(18px,4vw,38px)}
.shelf{position:absolute;left:7%;top:24%;width:18%;height:39%;background:#50311f;border:7px solid #392318;box-shadow:inset 0 30px #765039,inset 0 65px #765039,inset 0 100px #765039}
.shelf:after{content:"📚 📗 📚";color:#e9d0a7;font-size:clamp(12px,2vw,22px);position:absolute;top:10%;left:5%}
.chair{position:absolute;left:29%;bottom:20%;width:16%;height:28%;background:#40513a;border-radius:25px 25px 8px 8px;border:5px solid #263426}
.lamp{position:absolute;left:24%;top:35%;font-size:clamp(25px,5vw,55px)}
.door{position:absolute;right:9%;bottom:17%;width:12%;height:47%;background:linear-gradient(90deg,#57351f,#895a35,#57351f);border:8px solid #392319;box-shadow:inset 0 0 0 4px #b68b5b}
.door:after{content:"";position:absolute;right:12%;top:50%;width:9px;height:9px;border-radius:50%;background:#e8c77c}
#player{position:absolute;bottom:17%;left:48%;font-size:clamp(28px,5vw,55px);transition:left .12s;filter:drop-shadow(2px 4px 2px #24180f)}
.note{position:absolute;left:45%;bottom:17%;font-size:clamp(17px,3vw,30px);cursor:pointer}
.hud{position:absolute;top:3%;left:3%;right:3%;display:flex;justify-content:space-between;gap:8px;font:clamp(10px,1.5vw,15px) Arial}
.pill{background:#f0dfc2;color:#493321;padding:9px 13px;border-radius:8px}
#dialog{position:absolute;inset:0;background:#120d0ddd;display:none;place-items:center;padding:8%}
.paper{background:#f2e5cc;color:#46301f;padding:clamp(15px,4vw,35px);max-width:540px;width:100%;border:5px double #9b7952;text-align:center;line-height:1.8}
button{border:0;background:#52613b;color:white;padding:12px 24px;border-radius:8px;font-size:16px;cursor:pointer;margin-top:12px}
</style>
</head>
<body>
<div id="game">
<div class="frame">
<div class="wall"></div><div class="floor"></div>
<div class="window"></div><div class="shelf"></div>
<div class="chair"></div><div class="lamp">🪔</div>
<div class="door" id="door"></div>
<div class="note" onclick="letter()">✉️</div>
<div id="player">🧍🏻</div>
<div class="hud"><span class="pill">THE LITTLE MYSTERY ♡</span><span class="pill">E — تفاعل</span></div>
<div id="dialog"><div class="paper"><h2 id="heading"></h2><p id="message"></p><button onclick="next()">متابعة</button></div></div>
</div>
</div>
<script>
let x=48,part=0;
const player=document.getElementById('player');
const dialog=document.getElementById('dialog');
const pages=[
["عزيزي العميل A","وصلت إلى منزلك، وهذا يعني أن مهمتك بدأت."],
["مهمتك الأولى","هناك خمسة تحديات تفصلك عن المفاجأة."],
["تذكّر جيدًا","كل باب يخفي حكاية، وكل مرحلة تقرّبك من النهاية."]
];
function letter(){part=0;show()}
function show(){document.getElementById('heading').textContent=pages[part][0];document.getElementById('message').textContent=pages[part][1];dialog.style.display='grid'}
function next(){part++;if(part<pages.length)show();else dialog.style.display='none'}
document.addEventListener('keydown',e=>{
if(dialog.style.display==='grid'){if(e.key==='Enter')next();return}
if(e.key==='ArrowLeft'||e.key==='a')x=Math.max(3,x-3);
if(e.key==='ArrowRight'||e.key==='d')x=Math.min(94,x+3);
player.style.left=x+'%';
if(e.key.toLowerCase()==='e'&&x>82){document.getElementById('heading').textContent='الباب المغلق';document.getElementById('message').textContent='يبدو أن هذا الباب يحتاج إلى رمز سري. استعد للتحدي الأول!';dialog.style.display='grid'}
});
</script>
</body>
</html>
